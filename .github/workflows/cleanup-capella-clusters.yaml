# Scheduled cleanup of abandoned Capella clusters.
# ----------------------------------------------------
# A FIT run removes its own Capella cluster at teardown. A run that dies first
# leaves the cluster and its project behind, and Capella removes neither, so they
# bill until someone notices. This reaps them.
#
# Safety: the Capella organization is shared, so a cluster is only removed when
# fit-cli's purpose is stamped on it and its expiry has already passed. That
# reaches neither someone else's project nor a live run, which is why this needs
# no age window and can run hourly.
#
# Left alone, and named in the summary: clusters Capella itself failed to destroy,
# and clusters with no purpose, which predate the stamping and may be anyone's.
# Clearing the latter needs --include-unlabelled and a human.
#
# Manual run (e.g. to preview without deleting):
#   gh workflow run cleanup-capella-clusters.yaml --field dryRun=true --repo couchbaselabs/fit-cli
#   gh workflow run cleanup-capella-clusters.yaml --field env=dev --repo couchbaselabs/fit-cli
name: Cleanup old Capella clusters

on:
  schedule:
    # Hourly, on the half hour (UTC), offset from the instance reaper.
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      env:
        description: Capella environment to sweep, a key under `capella` in environments.json5.
        type: string
        default: prod
      dryRun:
        description: Report which clusters would be removed without removing anything.
        type: boolean
        default: false

# Don't pile up overlapping sweeps. An in-flight one is left to finish, because a
# Capella delete takes minutes and cancelling one strands the project it was on.
concurrency:
  group: cleanup-capella-clusters
  cancel-in-progress: false

permissions:
  id-token: write   # required for GitHub OIDC
  contents: read

jobs:
  cleanup-capella-clusters:
    runs-on: [ubuntu-latest]
    # Deletes are sequential and each waits on Capella, so a big backlog is slow.
    # Cap it rather than let one run sit for the 6h default.
    timeout-minutes: 120
    steps:
      - name: Checkout fit-cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Use OIDC to assume fit-cli-role, which can read the Capella organization
      # API key from AWS Secrets Manager.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-capella-cleanup-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile

      - name: Reap expired Capella clusters
        env:
          # schedule events carry no inputs, so fall back to the defaults below.
          CAPELLA_ENV: ${{ inputs.env || 'prod' }}
          DRY_RUN: ${{ inputs.dryRun || false }}
        run: |
          set -o pipefail
          ARGS=(cleanup --env "$CAPELLA_ENV")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          echo "Running: bun run capella-clusters ${ARGS[*]}"
          bun run capella-clusters "${ARGS[@]}" | tee /tmp/cleanup-capella-output.log

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Capella cluster cleanup"
            echo ""
            echo "- **Capella environment:** ${{ inputs.env || 'prod' }}"
            echo "- **Dry run:** ${{ inputs.dryRun || false }}"
            echo ""
            echo '```'
            cat /tmp/cleanup-capella-output.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
