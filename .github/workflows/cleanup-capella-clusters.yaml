# Scheduled cleanup of abandoned Capella clusters.
# ----------------------------------------------------
# A FIT run removes its own Capella cluster at teardown. A run that dies first
# leaves its cluster behind, and Capella does not remove it, so it bills until
# someone notices. This reaps them, in both the dev and prod Capella
# organizations.
#
# It runs `cbdinocluster cleanup cloud`, which removes the expired clusters in the
# fit-cli project, and the expired legacy cbdc2_ projects anywhere in the
# organization with their clusters. An expiry means the owner is done with it.
# Live clusters are never touched, so this can run hourly.
#
# Clusters Capella itself failed to destroy are left. They are flagged loudly in
# the log and raised as a warning annotation on the run page. Only Capella support
# can clear those.
#
# Manual run, e.g. to preview without deleting.
#   gh workflow run cleanup-capella-clusters.yaml --field dryRun=true --repo couchbaselabs/fit-cli

name: Cleanup old Capella clusters

on:
  schedule:
    # Hourly, on the half hour (UTC), offset from the instance reaper.
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      dryRun:
        description: Report which clusters would be removed without removing anything.
        type: boolean
        default: false

# Don't pile up overlapping sweeps. An in-flight one is left to finish, because a
# Capella delete takes minutes and cancelling one strands the cluster it was on.
concurrency:
  group: cleanup-capella-clusters
  cancel-in-progress: false

permissions:
  id-token: write   # required for GitHub OIDC
  contents: read

jobs:
  cleanup-capella-clusters:
    strategy:
      # A dev outage must not stop the prod sweep, and the other way round.
      fail-fast: false
      matrix:
        capellaEnv: [dev, prod]
    name: cleanup-capella-clusters (${{ matrix.capellaEnv }})
    runs-on: [ubuntu-latest]
    # Each delete waits on Capella, so a big backlog is slow. Cap it rather than
    # let one run sit for the 6h default. The cleanup is bounded at 90m inside the
    # command, so it gives up before this cap and the summary is still written.
    timeout-minutes: 120
    steps:
      - name: Checkout fit-cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Use OIDC to assume fit-cli-role, which can read the Capella organization
      # API keys from AWS Secrets Manager (capella/dev and capella/prod).
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-capella-cleanup-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile

      - name: Reap expired Capella clusters
        env:
          # schedule events carry no inputs, so fall back to the defaults below.
          CAPELLA_ENV: ${{ matrix.capellaEnv }}
          DRY_RUN: ${{ inputs.dryRun || false }}
        run: |
          set -o pipefail
          ARGS=(cleanup --env "$CAPELLA_ENV")
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          echo "Running: bun run capella-clusters ${ARGS[*]}"
          bun run capella-clusters "${ARGS[@]}" | tee /tmp/cleanup-capella-output.log

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Capella cluster cleanup (${{ matrix.capellaEnv }})"
            echo ""
            echo "- **Dry run:** ${{ inputs.dryRun || false }}"
            echo ""
            echo '```'
            cat /tmp/cleanup-capella-output.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
