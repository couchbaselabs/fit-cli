# Scheduled cleanup of abandoned Capella clusters.
# ----------------------------------------------------
# A FIT run removes its own Capella cluster at teardown. A run that dies first
# leaves the cluster and its project behind, and Capella removes neither, so they
# bill until someone notices. This reaps them, in both the dev and prod Capella
# organizations.
#
# The first pass only removes a cluster when fit-cli's purpose is stamped on it and
# its expiry has already passed. That reaches neither someone else's project nor a
# live run, which is why the default needs no extra age window and can run hourly.
#
# The second pass (--all-expired, on by default) then removes every expired
# cbdinocluster project in the organization, whoever made it. The organization is
# shared and other teams leave expired projects behind. The FIT test driver used to
# clear them by accident after every test, and that call is gone, so this job owns
# the duty now. Only expired projects are taken, so no live run is at risk.
#
# Left alone, and named in the summary. Clusters Capella itself failed to destroy.
# They need a human, so they are flagged loudly and also raised as a warning
# annotation on the run page. Only Capella support can clear those.
#
# Manual run (e.g. to preview without deleting):
#   gh workflow run cleanup-capella-clusters.yaml --field dryRun=true --repo couchbaselabs/fit-cli
#   gh workflow run cleanup-capella-clusters.yaml --field olderThan=2h --repo couchbaselabs/fit-cli
#   gh workflow run cleanup-capella-clusters.yaml --field allExpired=false --repo couchbaselabs/fit-cli
name: Cleanup old Capella clusters

on:
  schedule:
    # Hourly, on the half hour (UTC), offset from the instance reaper.
    - cron: "30 * * * *"
  workflow_dispatch:
    inputs:
      olderThan:
        description: Only reap clusters whose expiry passed at least this long ago, e.g. 2h, 1d. Expiry alone already means a run is done with the cluster, so the default adds no extra wait.
        type: string
        default: 0h
      allExpired:
        description: Also remove every expired cbdinocluster project in the organization, not only fit-cli's.
        type: boolean
        default: true
      dryRun:
        description: Report which clusters would be removed without removing anything.
        type: boolean
        default: false

# Don't pile up overlapping sweeps. An in-flight one is left to finish, because a
# Capella delete takes minutes and cancelling one strands the project it was on.
concurrency:
  group: cleanup-capella-clusters
  cancel-in-progress: false

permissions:
  id-token: write   # required for GitHub OIDC
  contents: read

jobs:
  cleanup-capella-clusters:
    strategy:
      # A dev outage must not stop the prod sweep, and the other way round.
      fail-fast: false
      matrix:
        capellaEnv: [dev, prod]
    name: cleanup-capella-clusters (${{ matrix.capellaEnv }})
    runs-on: [ubuntu-latest]
    # Deletes are sequential and each waits on Capella, so a big backlog is slow.
    # Cap it rather than let one run sit for the 6h default. The all-expired pass
    # is bounded at 90m inside the command, so it gives up before this cap and the
    # summary is still written.
    timeout-minutes: 120
    steps:
      - name: Checkout fit-cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Use OIDC to assume fit-cli-role, which can read the Capella organization
      # API keys from AWS Secrets Manager (capella/dev and capella/prod).
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-capella-cleanup-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile

      - name: Reap expired Capella clusters
        env:
          # schedule events carry no inputs, so fall back to the defaults below.
          CAPELLA_ENV: ${{ matrix.capellaEnv }}
          OLDER_THAN: ${{ inputs.olderThan || '0h' }}
          DRY_RUN: ${{ inputs.dryRun || false }}
          # `inputs.allExpired || true` cannot express a default of true, false || true
          # is true, so the schedule case is picked out by the event name instead.
          ALL_EXPIRED: ${{ github.event_name == 'schedule' && 'true' || inputs.allExpired }}
        run: |
          set -o pipefail
          ARGS=(cleanup --env "$CAPELLA_ENV" --older-than "$OLDER_THAN")
          if [ "$ALL_EXPIRED" = "true" ]; then
            ARGS+=(--all-expired)
          fi
          if [ "$DRY_RUN" = "true" ]; then
            ARGS+=(--dry-run)
          fi
          echo "Running: bun run capella-clusters ${ARGS[*]}"
          bun run capella-clusters "${ARGS[@]}" | tee /tmp/cleanup-capella-output.log

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Capella cluster cleanup (${{ matrix.capellaEnv }})"
            echo ""
            echo "- **Older than:** ${{ inputs.olderThan || '0h' }}"
            echo "- **All expired:** ${{ github.event_name == 'schedule' && 'true' || inputs.allExpired }}"
            echo "- **Dry run:** ${{ inputs.dryRun || false }}"
            echo ""
            echo '```'
            cat /tmp/cleanup-capella-output.log 2>/dev/null || echo "(no output captured)"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
