name: Promote to ci

on:
  workflow_dispatch:
    inputs:
      reset_from_latest:
        description: 'Reset the "ci" branch to match "latest" (main) before building. Turn off to promote the existing "ci" branch as-is (e.g. after cherry-picking a targeted fix onto it).'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ci
          fetch-depth: 0

      - name: Reset ci branch to latest
        if: ${{ inputs.reset_from_latest }}
        run: |
          git fetch origin main
          git reset --hard origin/main
          git push origin HEAD:ci

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries
        run: |
          GIT_SHA="$(git rev-parse HEAD)"
          mkdir -p dist
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          bun build --compile --target=bun-linux-x64   --define "__FIT_GIT_SHA=\"${GIT_SHA}\""   --define "__FIT_BUILD_TIME=\"${BUILD_TIME}\""  src/fit/main/main.ts --outfile dist/fit-linux-x64
          bun build --compile --target=bun-linux-arm64  --define "__FIT_GIT_SHA=\"${GIT_SHA}\""   --define "__FIT_BUILD_TIME=\"${BUILD_TIME}\""  src/fit/main/main.ts --outfile dist/fit-linux-arm64
          bun build --compile --target=bun-darwin-x64  --define "__FIT_GIT_SHA=\"${GIT_SHA}\""   --define "__FIT_BUILD_TIME=\"${BUILD_TIME}\""  src/fit/main/main.ts --outfile dist/fit-darwin-x64
          bun build --compile --target=bun-darwin-arm64 --define "__FIT_GIT_SHA=\"${GIT_SHA}\""   --define "__FIT_BUILD_TIME=\"${BUILD_TIME}\""  src/fit/main/main.ts --outfile dist/fit-darwin-arm64

      - name: Update ci release
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          The `ci` channel is manually promoted, infrequently — intended for GHA workflows and other automation that need a very stable binary.
          Changes are communicated in advance.

          ## Install

          ```sh
          curl -fsSL https://raw.githubusercontent.com/couchbaselabs/fit-cli/main/install.sh | CHANNEL=ci bash
          ```

          > **After installing, run `fit config edit` to configure your credentials before first use.**

          See the [README](https://github.com/couchbaselabs/fit-cli#getting-started) for full usage instructions.
          EOF

          gh release delete ci --yes --cleanup-tag 2>/dev/null || true
          gh release create ci \
            --title "CI" \
            --target ci \
            --notes-file /tmp/release-notes.md \
            dist/fit-linux-x64 \
            dist/fit-linux-arm64 \
            dist/fit-darwin-x64 \
            dist/fit-darwin-arm64
        env:
          GH_TOKEN: ${{ github.token }}
