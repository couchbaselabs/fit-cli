# Scheduled fit-cli maintenance. Runs nightly (and on demand) and holds the
# housekeeping jobs that keep the repo and its releases tidy:
#
#   refresh-fit-tests-cache  Keep src/fit/shared/select-fit-tests/fit-tests-cache.json5
#                            (the known FIT test-driver test files, used for test
#                            selection) in sync with transactions-fit-performer.
#                            A diff is opened as a PR for review, not pushed to main.
#
#   publish-branch-channels  Publish every git branch as an installable release
#                            "channel" (CHANNEL=<branch>), and prune channels whose
#                            branch has been deleted. Mirrors `fit maintenance channels`.
name: Maintenance

on:
  schedule:
    - cron: "0 * * * *"   # hourly: publish/prune branch channels
    - cron: "0 8 * * *"   # daily 08:00 UTC: additionally refresh the FIT tests cache
  workflow_dispatch:

concurrency:
  group: maintenance
  cancel-in-progress: true

jobs:
  publish-branch-channels:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # create/delete releases (channels) in this repo
    steps:
      - name: Checkout fit-cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          # Full history so a detached worktree can be built at any branch tip.
          fetch-depth: 0
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile

      - name: Publish branch channels and prune deleted ones
        env:
          GH_TOKEN: ${{ github.token }}
        run: bun run maintenance channels sync --prune


  refresh-fit-tests-cache:
    runs-on: ubuntu-latest
    # Opens a PR and reaches AWS + an external repo, so keep it daily even though
    # the workflow now fires hourly for branch channels: run only on the daily
    # cron (08:00 UTC) and on manual dispatch, not on the hourly ticks.
    if: github.event_name == 'workflow_dispatch' || github.event.schedule == '0 8 * * *'
    permissions:
      id-token: write   # required for GitHub OIDC
      contents: write
      pull-requests: write
    steps:
      - name: Checkout fit-cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Use OIDC to assume fit-cli-role, which can read fit-cli/github/token.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-refresh-fit-tests-cache-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile

      - name: Fetch GitHub token from AWS secret
        id: gh-secret
        run: |
          TOKEN=$(aws secretsmanager get-secret-value --secret-id fit-cli/github/token \
            --query SecretString --output text | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not read .token from AWS secret fit-cli/github/token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Checkout transactions-fit-performer
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          repository: couchbaselabs/transactions-fit-performer
          token: ${{ steps.gh-secret.outputs.token }}
          path: transactions-fit-performer
          persist-credentials: false

      - name: Regenerate fit-tests-cache.json5
        run: bun src/fit/shared/select-fit-tests/generate-fit-tests-cache.ts --root transactions-fit-performer

      - name: Job summary
        run: |
          {
            echo "## FIT tests cache refresh"
            echo ""
            if git diff --quiet -- src/fit/shared/select-fit-tests/fit-tests-cache.json5; then
              echo "No changes — cache already up to date."
            else
              echo "Changes detected:"
              echo '```diff'
              git diff -- src/fit/shared/select-fit-tests/fit-tests-cache.json5
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Open PR if the cache changed
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          commit-message: "chore: refresh fit-tests-cache.json5"
          title: "chore: refresh FIT test list"
          body: >
            Auto-generated by the Maintenance workflow, regenerated from the
            current transactions-fit-performer test-driver sources.
          branch: chore/refresh-fit-tests-cache
          delete-branch: true
          add-paths: src/fit/shared/select-fit-tests/fit-tests-cache.json5
