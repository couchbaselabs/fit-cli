name: Build binaries

on:
  push:
    branches: [main]
  workflow_call:
    outputs:
      artifact-name:
        description: Name of the uploaded artifact containing the linux-x64 binary
        value: ${{ jobs.build.outputs.artifact-name }}

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to upload release assets
    outputs:
      artifact-name: ${{ steps.upload.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build binaries
        env:
          GIT_SHA: ${{ github.sha }}
        run: |
          mkdir -p dist
          BUILD_TIME="$(date -u +"%Y-%m-%dT%H:%M:%SZ")"
          bun build --compile --target=bun-linux-x64   --define "__FIT_GIT_SHA=\"${GIT_SHA}\""   --define "__FIT_BUILD_TIME=\"${BUILD_TIME}\""  src/fit/main/main.ts --outfile dist/fit-linux-x64
          bun build --compile --target=bun-linux-arm64  --define "__FIT_GIT_SHA=\"${GIT_SHA}\""   --define "__FIT_BUILD_TIME=\"${BUILD_TIME}\""  src/fit/main/main.ts --outfile dist/fit-linux-arm64
          bun build --compile --target=bun-darwin-x64  --define "__FIT_GIT_SHA=\"${GIT_SHA}\""   --define "__FIT_BUILD_TIME=\"${BUILD_TIME}\""  src/fit/main/main.ts --outfile dist/fit-darwin-x64
          bun build --compile --target=bun-darwin-arm64 --define "__FIT_GIT_SHA=\"${GIT_SHA}\""   --define "__FIT_BUILD_TIME=\"${BUILD_TIME}\""  src/fit/main/main.ts --outfile dist/fit-darwin-arm64

      - name: Upload artifact (for workflow_call consumers)
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: fit-binaries-${{ github.sha }}
          path: dist/fit-*
          retention-days: 7

      - name: Update latest pre-release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          cat > /tmp/release-notes.md << 'EOF'
          > ⚠️ **This is the tip-of-main pre-release, automatically updated on every push. For production/CI usage install the [ci channel](https://github.com/couchbaselabs/fit-cli/releases) instead (`CHANNEL=ci`).**

          ## Install

          ```sh
          curl -fsSL https://raw.githubusercontent.com/couchbaselabs/fit-cli/main/install.sh | CHANNEL=latest bash
          ```

          > **After installing, run `fit config edit` to configure your credentials before first use.**

          See the [README](https://github.com/couchbaselabs/fit-cli#getting-started) for full usage instructions.
          EOF

          gh release delete stable --yes --cleanup-tag 2>/dev/null || true
          gh release delete latest --yes --cleanup-tag 2>/dev/null || true
          gh release create latest \
            --prerelease \
            --title "Latest (tip of main)" \
            --notes-file /tmp/release-notes.md \
            dist/fit-linux-x64 \
            dist/fit-linux-arm64 \
            dist/fit-darwin-x64 \
            dist/fit-darwin-arm64
        env:
          GH_TOKEN: ${{ github.token }}
