name: Run FIT Testing (Shared)
run-name: ${{ inputs.performer }} with ${{ inputs.preset }}

on:
  workflow_dispatch:
    inputs:
      preset:
        description: FIT presets or preset groups to run, comma-separated. (`fit preset list`)
        required: true
        type: string
      performer:
        description: Performer image name to use e.g. "java-fit-performer:main".
        required: true
        type: string
      definition_file:
        description: A fit-cli definition file e.g. "https://gist.githubusercontent.com/programmatix/<gist-id>/raw" or "examples/fit-functional-sanity-test.json5" (local to fit-cli).
        type: string
      definition_base_64:
        description: Optional base64-encoded definition contents. When set, this takes precedence over definitionFile.
        type: string
      collect_extra_diagnostics:
        description: Collect additional diagnostics (includes cbcollect, is slower)
        default: true
        type: boolean
      channel:
        description: fit-cli install channel. ("latest" or "ci")
        required: false
        type: string
        default: ci
      transactionsFitPerformerRef:
        description: Fetch and check out this Gerrit ref in transactions-fit-performer before building (e.g. refs/changes/29/246329/1).
        type: string
        default: ""
      cbdinocluster_pr:
        description: Build cbdinocluster from this couchbaselabs/cbdinocluster PR number instead of installing the latest release.
        type: string
        default: ""
      env_override:
        description: >-
          Overrides applied to environments.json5 while the preset is rendered, as comma-separated
          <path>=<value> pairs, e.g. "defaults.clusterVersion=8.1.0-2710". Each pair is passed to
          `fit run` as --env-override, and each path is the one the preset's
          {{environments.<path>}} placeholder names.
        type: string
        default: ""
      slack_thread:
        description: Slack thread to post a run summary into (e.g. https://couchbase.slack.com/archives/C05LNBVQRE3/p1786376341783169).
        type: string
  workflow_call:
    inputs:
      preset:
        description: FIT preset(s) and/or preset group(s) to generate and execute, comma-separated. (`fit preset list`)
        required: true
        type: string
      performer:
        description: Performer image name to use e.g. "java-fit-performer:main".
        required: true
        type: string
      definition_file:
        description: A fit-cli definition file e.g. "https://gist.githubusercontent.com/programmatix/<gist-id>/raw" or "examples/fit-functional-sanity-test.json5" (local to fit-cli).
        type: string
      definition_base_64:
        description: Optional base64-encoded definition contents. When set, this takes precedence over definitionFile.
        type: string
      collect_extra_diagnostics:
        description: Collect additional diagnostics (includes cbcollect, is slower)
        required: false
        type: boolean
        default: true
      channel:
        description: fit-cli install channel. ("latest" or "ci")
        required: false
        type: string
        default: ci
      transactionsFitPerformerRef:
        description: Fetch and check out this Gerrit ref in transactions-fit-performer before building (e.g. refs/changes/29/246329/1).
        type: string
        default: ""
      cbdinocluster_pr:
        description: Build cbdinocluster from this couchbaselabs/cbdinocluster PR number instead of installing the latest release.
        type: string
        default: ""
      env_override:
        description: >-
          Overrides applied to environments.json5 while the preset is rendered, as comma-separated
          <path>=<value> pairs, e.g. "defaults.clusterVersion=8.1.0-2710". Each pair is passed to
          `fit run` as --env-override, and each path is the one the preset's
          {{environments.<path>}} placeholder names.
        type: string
        default: ""
      slack_thread:
        description: Slack thread to post a run summary into (e.g. https://couchbase.slack.com/archives/C05LNBVQRE3/p1786376341783169).  Only works for specific Slack channels
        type: string

permissions:
  id-token: write   # required for GitHub OIDC

jobs:
  preset-matrix:
    runs-on: ubuntu-latest
    outputs:
      presets: ${{ steps.presets.outputs.presets }}
    steps:
      - name: Preset matrix
        id: presets
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/couchbaselabs/fit-cli/main/install.sh | CHANNEL="$CHANNEL" bash
          presets=$(fit definition expand-preset-group "$PRESETS" --json)
          echo "presets=$presets" >> "$GITHUB_OUTPUT"
        env:
          PRESETS: ${{ inputs.preset }}
          CHANNEL: ${{ inputs.channel }}

  fit-cli:
    needs: preset-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJson(needs.preset-matrix.outputs.presets) }}
    name: ${{ matrix.preset }}
    steps:
      # Assume the AWS role 'fit-cli-role' from account 'cb-sdk' (958525475024), as this has all required AWS permissions.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-${{ github.actor }}-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3
          role-duration-seconds: 43200

      # Use GitHub OIDC to become service account fit-cli-gcp.
      - name: Configure GCP credentials via workload identity federation
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: projects/84079313096/locations/global/workloadIdentityPools/fit-cli-github/providers/github-actions
          service_account: fit-cli-gcp@couchbase-qe.iam.gserviceaccount.com

      - name: Run fit-cli
        env:
          GERRIT_REF: ${{ inputs.transactionsFitPerformerRef || '' }}
          CBDINOCLUSTER_PR: ${{ inputs.cbdinocluster_pr || '' }}
          ENV_OVERRIDE: ${{ inputs.env_override || '' }}
          CHANNEL: ${{ inputs.channel }}
          PRESET: ${{ matrix.preset }}
          PERFORMER: ${{ inputs.performer }}
          COLLECT_EXTRA_DIAGNOSTICS: ${{ inputs.collect_extra_diagnostics }}
          SLACK_THREAD: ${{ inputs.slack_thread || '' }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/couchbaselabs/fit-cli/main/install.sh | CHANNEL="$CHANNEL" bash
          args=(preset "$PRESET" --performer "$PERFORMER")
          if [[ "$COLLECT_EXTRA_DIAGNOSTICS" == "true" ]]; then
            args+=(--cbcollect)
          fi
          if [ -n "$GERRIT_REF" ]; then
            args+=(--override "setup.repos.transactions-fit-performer.gerritRef=$GERRIT_REF")
          fi
          if [ -n "$CBDINOCLUSTER_PR" ]; then
            args+=(--override "setup.cbdinocluster.source.git.pr=$CBDINOCLUSTER_PR")
          fi
          if [ -n "$ENV_OVERRIDE" ]; then
            # Comma-separated, so one input can carry several overrides; --env-override is repeatable.
            # Surrounding whitespace is trimmed and empty segments dropped, so that "a=1, b=2" and a
            # trailing comma both behave, rather than passing " b=2" or "" through to fit.
            while IFS= read -r env_override; do
              [ -n "$env_override" ] || continue
              args+=(--env-override "$env_override")
            done < <(printf '%s\n' "$ENV_OVERRIDE" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//')
          fi
          if [ -n "$SLACK_THREAD" ]; then
            fit slack write-placeholder "$RUNNER_TEMP/slack-result.json" "$PRESET"
            args+=(--slack-result-file "$RUNNER_TEMP/slack-result.json")
          fi

          fit run "${args[@]}"

      - name: Upload Slack result for combined summary
        if: always() && (inputs.slack_thread || '') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: slack-result-${{ strategy.job-index }}
          path: ${{ runner.temp }}/slack-result.json
          retention-days: 1
          if-no-files-found: warn

  aggregate-matrix-results:
    needs: [preset-matrix, fit-cli]
    if: always() && (inputs.slack_thread || '') != ''
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-${{ github.actor }}-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3

      - name: Download every preset's Slack result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: slack-result-*
          path: ${{ runner.temp }}/slack-results
          merge-multiple: false

      - name: Post combined Slack summary
        env:
          CHANNEL: ${{ inputs.channel }}
          SLACK_THREAD: ${{ inputs.slack_thread || '' }}
          TITLE: ${{ inputs.preset }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/couchbaselabs/fit-cli/main/install.sh | CHANNEL="$CHANNEL" bash
          fit slack post-collected "$SLACK_THREAD" "$TITLE" "$RUNNER_TEMP/slack-results"
