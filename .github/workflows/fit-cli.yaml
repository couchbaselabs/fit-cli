name: Run FIT Testing (Shared)

on:
  workflow_dispatch:
    inputs:
      preset:
        description: FIT presets or preset groups to run, comma-separated. (`fit preset list`)
        required: true
        type: string
      performer:
        description: Performer image name to use e.g. "java-fit-performer:main".
        required: true
        type: string
      definition_file:
        description: A fit-cli definition file e.g. "https://gist.githubusercontent.com/programmatix/<gist-id>/raw" or "examples/fit-functional-sanity-test.json5" (local to fit-cli).
        type: string
      definition_base_64:
        description: Optional base64-encoded definition contents. When set, this takes precedence over definitionFile.
        type: string
      collect_extra_diagnostics:
        description: Collect additional diagnostics (includes cbcollect, is slower)
        default: true
        type: boolean
      channel:
        description: fit-cli install channel. ("latest" or "ci")
        required: false
        type: string
        default: ci
      transactionsFitPerformerRef:
        description: Fetch and check out this Gerrit ref in transactions-fit-performer before building (e.g. refs/changes/29/246329/1).
        type: string
        default: ""
      cbdinocluster_pr:
        description: Build cbdinocluster from this couchbaselabs/cbdinocluster PR number instead of installing the latest release.
        type: string
        default: ""
      slack_thread:
        description: Slack thread to post a run summary into (e.g. https://couchbase.slack.com/archives/C05LNBVQRE3/p1786376341783169).
        type: string
  workflow_call:
    inputs:
      preset:
        description: FIT preset(s) and/or preset group(s) to generate and execute, comma-separated. (`fit preset list`)
        required: true
        type: string
      performer:
        description: Performer image name to use e.g. "java-fit-performer:main".
        required: true
        type: string
      definition_file:
        description: A fit-cli definition file e.g. "https://gist.githubusercontent.com/programmatix/<gist-id>/raw" or "examples/fit-functional-sanity-test.json5" (local to fit-cli).
        type: string
      definition_base_64:
        description: Optional base64-encoded definition contents. When set, this takes precedence over definitionFile.
        type: string
      collect_extra_diagnostics:
        description: Collect additional diagnostics (includes cbcollect, is slower)
        required: false
        type: boolean
        default: true
      channel:
        description: fit-cli install channel. ("latest" or "ci")
        required: false
        type: string
        default: ci
      transactionsFitPerformerRef:
        description: Fetch and check out this Gerrit ref in transactions-fit-performer before building (e.g. refs/changes/29/246329/1).
        type: string
        default: ""
      cbdinocluster_pr:
        description: Build cbdinocluster from this couchbaselabs/cbdinocluster PR number instead of installing the latest release.
        type: string
        default: ""
      slack_thread:
        description: Slack thread to post a run summary into (e.g. https://couchbase.slack.com/archives/C05LNBVQRE3/p1786376341783169).  Only works for specific Slack channels
        type: string

permissions:
  id-token: write   # required for GitHub OIDC

jobs:
  preset-matrix:
    runs-on: ubuntu-latest
    outputs:
      presets: ${{ steps.presets.outputs.presets }}
    steps:
      - name: Preset matrix
        id: presets
        shell: bash
        run: |
          curl -fsSL https://raw.githubusercontent.com/couchbaselabs/fit-cli/main/install.sh | CHANNEL="$CHANNEL" bash
          presets=$(fit definition expand-preset-group "$PRESETS" --json)
          echo "presets=$presets" >> "$GITHUB_OUTPUT"
        env:
          PRESETS: ${{ inputs.preset }}
          CHANNEL: ${{ inputs.channel }}

  fit-cli:
    needs: preset-matrix
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        preset: ${{ fromJson(needs.preset-matrix.outputs.presets) }}
    name: ${{ matrix.preset }}
    steps:
      # Assume the AWS role 'fit-cli-role' from account 'cb-sdk' (958525475024), as this has all required AWS permissions.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-${{ github.actor }}-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3
          role-duration-seconds: 43200

      # Use GitHub OIDC to become service account fit-cli-gcp.
      - name: Configure GCP credentials via workload identity federation
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/84079313096/locations/global/workloadIdentityPools/fit-cli-github/providers/github-actions
          service_account: fit-cli-gcp@couchbase-qe.iam.gserviceaccount.com

      - name: Run fit-cli
        env:
          GERRIT_REF: ${{ inputs.transactionsFitPerformerRef || '' }}
          CBDINOCLUSTER_PR: ${{ inputs.cbdinocluster_pr || '' }}
          CHANNEL: ${{ inputs.channel }}
          PRESET: ${{ matrix.preset }}
          PERFORMER: ${{ inputs.performer }}
          COLLECT_EXTRA_DIAGNOSTICS: ${{ inputs.collect_extra_diagnostics }}
          SLACK_THREAD: ${{ inputs.slack_thread || '' }}
        run: |
          curl -fsSL https://raw.githubusercontent.com/couchbaselabs/fit-cli/main/install.sh | CHANNEL="$CHANNEL" bash
          args=(preset "$PRESET" --performer "$PERFORMER")
          if [[ "$COLLECT_EXTRA_DIAGNOSTICS" == "true" ]]; then
            args+=(--cbcollect)
          fi
          if [ -n "$GERRIT_REF" ]; then
            args+=(--override "setup.repos.transactions-fit-performer.gerritRef=$GERRIT_REF")
          fi
          if [ -n "$CBDINOCLUSTER_PR" ]; then
            args+=(--override "setup.cbdinocluster.source.git.pr=$CBDINOCLUSTER_PR")
          fi
          # When set, fit-cli posts a run summary into this Slack thread. Best-effort:
          # a Slack failure warns but never fails the run.
          if [ -n "$SLACK_THREAD" ]; then
            args+=(--slack-thread "$SLACK_THREAD")
          fi

          fit run "${args[@]}"
