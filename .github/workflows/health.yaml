# fit health: daily FIT test-health report for every opted-in SDK (see specs/health.md).
#
# For each SDK in src/fit/health/registry/health-opt-ins.ts:
#   1. `fit health backfill` - picks up the nights since the last run: each nightly's CI log,
#      then the full JUnit results from its S3 run archive.
#   2. `fit health report` - classifies every test, writes the job summary, uploads the HTML
#      and JSON report as artifacts, and posts a Slack digest if the SDK's opt-in names a channel.
#
# Records are kept in the shared S3 store between runs. This only reads other repos' CI logs
# and run archives; it changes nothing about how any SDK's nightly runs.
name: FIT health

on:
  schedule:
    # 12:00 UTC: after the last SDK nightly of the day has finished. Kotlin's starts at 05:00
    # and has run as long as six hours (to 11:14); the rest are done by about 06:00.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      sdk:
        description: One SDK to run (default - every opted-in SDK).
        required: false
        type: string
      store:
        description: The store to use.
        required: false
        type: string
        default: s3://fit-cli/health-dev/
      create_store:
        description: Create the SDK's part of the store if it doesn't exist yet (first run for an SDK only).
        required: false
        type: boolean
        default: false
      slack:
        description: Post Slack digests for SDKs that configure a channel.
        required: false
        type: boolean
        default: true

# Least privilege by default; the health job adds id-token: write for OIDC.
permissions:
  contents: read

env:
  # A dev prefix while this is being proven; becomes s3://fit-cli/health/ after.
  FIT_HEALTH_STORE: ${{ inputs.store || 's3://fit-cli/health-dev/' }}

jobs:
  opt-ins:
    runs-on: ubuntu-latest
    outputs:
      sdks: ${{ steps.list.outputs.sdks }}
    steps:
      - name: Checkout fit-cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile
      - name: List opted-in SDKs
        id: list
        env:
          ONLY: ${{ inputs.sdk }}
        run: |
          if [ -n "$ONLY" ]; then
            # The SDK name ends up in job names and CLI arguments: accept only an SDK-shaped value.
            if ! printf '%s' "$ONLY" | grep -Eq '^[a-z0-9][a-z0-9-]{0,40}$'; then
              echo "::error::sdk must be an SDK name like dotnet or java, got: $ONLY"
              exit 1
            fi
            echo "sdks=$(jq -cn --arg s "$ONLY" '[$s]')" >> "$GITHUB_OUTPUT"
          else
            echo "sdks=$(bun src/fit/main/main.ts health opt-ins --json)" >> "$GITHUB_OUTPUT"
          fi

  health:
    needs: opt-ins
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.opt-ins.outputs.sdks) }}
    # One run per SDK at a time: two jobs pushing the same SDK's part of the store would race.
    concurrency:
      group: fit-health-${{ matrix.sdk }}
      cancel-in-progress: false
    permissions:
      id-token: write   # GitHub OIDC, to assume fit-cli-role
      contents: read
    steps:
      - name: Checkout fit-cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # fit-cli-role can read s3://fit-cli/runs/, write the health store, and read the
      # fit-cli/github/token and fit-cli/slack/token secrets.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-fit-health-${{ matrix.sdk }}-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile

      # The org token reads other repos' Actions logs, including private ones; this
      # workflow's own token only covers the fit-cli repo.
      - name: Fetch GitHub token from AWS secret
        id: gh-secret
        run: |
          TOKEN=$(aws secretsmanager get-secret-value --secret-id fit-cli/github/token \
            --query SecretString --output text | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not read .token from AWS secret fit-cli/github/token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # The SDK reaches the scripts through env and quoting, never ${{ }} inside run:.
      - name: Backfill ${{ matrix.sdk }}
        env:
          SDK: ${{ matrix.sdk }}
          GH_TOKEN: ${{ steps.gh-secret.outputs.token }}
          CREATE: ${{ inputs.create_store && '--create-store' || '' }}
        run: bun src/fit/main/main.ts health backfill "$SDK" $CREATE

      # Report on what's stored even if backfill failed: a bad night shouldn't cost the report.
      - name: Report ${{ matrix.sdk }}
        if: ${{ !cancelled() }}
        env:
          SDK: ${{ matrix.sdk }}
          # Reads the SDK's and the FIT driver's commits around each change (best-effort).
          GH_TOKEN: ${{ steps.gh-secret.outputs.token }}
          # An expression's '' is falsy, so choose between two non-empty flags. In CI a
          # configured channel posts anyway; --slack just says so explicitly.
          SLACK_FLAG: ${{ (github.event_name == 'schedule' || inputs.slack) && '--slack' || '--no-slack' }}
        run: bun src/fit/main/main.ts health report "$SDK" --out health-report $SLACK_FLAG

      - name: Upload the report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: health-report-${{ matrix.sdk }}
          path: health-report/
          if-no-files-found: ignore
          retention-days: 30

  # Publish every SDK's latest report to the repo's Pages site, one page per SDK:
  # https://<owner>.github.io/<repo>/health/<sdk>/. The reports hold nothing that isn't
  # already public in the SDKs' own CI runs; the pages are marked noindex.
  #
  # A Pages deploy replaces the whole site, so one job builds it from every SDK's report
  # (keeping the published page of an SDK that has none this run) and one job deploys it.
  site:
    needs: health
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read   # to find out whether Pages is enabled, and its address
    outputs:
      deploy: ${{ steps.pages.outputs.deploy }}
    steps:
      - name: Checkout fit-cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # Deploy only from the default branch (the github-pages environment allows nothing
      # else), and only once Pages is enabled with GitHub Actions as its source. Otherwise the
      # site is still built and uploaded as an artifact, so it can be checked from any branch.
      - name: Check Pages
        id: pages
        env:
          GH_TOKEN: ${{ github.token }}
          ON_DEFAULT_BRANCH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          if info=$(gh api "repos/$GITHUB_REPOSITORY/pages" 2>/dev/null) && [ "$(jq -r .build_type <<<"$info")" = "workflow" ]; then
            echo "url=$(jq -r '.html_url | rtrimstr("/")' <<<"$info")" >> "$GITHUB_OUTPUT"
            enabled=true
          else
            enabled=false
            echo "::notice::Pages is not enabled with GitHub Actions as its source: the site is built but not deployed."
          fi
          if [ "$enabled" = true ] && [ "$ON_DEFAULT_BRANCH" = true ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            [ "$ON_DEFAULT_BRANCH" = true ] || echo "::notice::Not on the default branch: the site is built but not deployed."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Download the reports
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: health-report-*
          path: reports

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile

      # Every SDK's report from this run, compared with every other's: the same test on the
      # other SDKs, written back into each triage.json and page.
      - name: Compare the SDKs
        run: bun src/fit/main/main.ts health cross --dir reports

      - name: Build the site
        env:
          LIVE: ${{ steps.pages.outputs.url }}
        run: .github/scripts/health-site.sh reports site "$LIVE"

      - name: Upload the site
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: health-site
          path: site/
          retention-days: 7

      - name: Upload the site for Pages
        if: ${{ steps.pages.outputs.deploy == 'true' }}
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: site/

  deploy:
    needs: site
    if: ${{ !cancelled() && needs.site.outputs.deploy == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pages: write      # to deploy
      id-token: write   # deploy-pages proves the deployment came from this workflow
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - name: Deploy to Pages
        id: deploy
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5

      - name: Link the reports
        env:
          URL: ${{ steps.deploy.outputs.page_url }}
        run: |
          echo "### FIT health reports: [${URL}health/](${URL}health/)" >> "$GITHUB_STEP_SUMMARY"
