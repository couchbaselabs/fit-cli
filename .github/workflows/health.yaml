# fit health: daily FIT test-health report for every opted-in SDK (see specs/health.md).
#
# For each SDK in src/fit/health/registry/health-opt-ins.ts:
#   1. `fit health backfill` - picks up the nights since the last run: each nightly's CI log,
#      then the full JUnit results from its S3 run archive.
#   2. `fit health report` - classifies every test, writes the HTML and JSON report, and posts
#      a Slack digest if the SDK's settings in the store name a channel
#      (`fit health settings <sdk> --slack-channel <id>`).
# Then one job builds the site from every SDK's report and publishes it to the internal
# couchbaselabs/fit-health repo, which serves it as a private Pages site. On Mondays it also
# adds the weekly wrap-up of the week to Sunday (`fit health weekly`), and posts it to the
# channel in the FIT_HEALTH_WEEKLY_SLACK_CHANNEL repository variable.
#
# The reports are private: they name commits from the private driver repo and tests from the
# private run archives. This repo is public, so nothing from them may reach its Actions - no
# job summary, no artifacts, no command output in the logs (.github/scripts/health-quiet.sh).
# The health jobs hand their reports to the site job through the private S3 bucket instead.
#
# Records are kept in the shared S3 store between runs. This only reads other repos' CI logs
# and run archives; it changes nothing about how any SDK's nightly runs.
name: FIT health

on:
  schedule:
    # 12:00 UTC: after the last SDK nightly of the day has finished. Kotlin's starts at 05:00
    # and has run as long as six hours (to 11:14); the rest are done by about 06:00.
    - cron: "0 12 * * *"
  workflow_dispatch:
    inputs:
      sdk:
        description: One SDK to run (default - every opted-in SDK).
        required: false
        type: string
      store:
        description: The store to use.
        required: false
        type: string
        default: s3://fit-cli/health-dev/
      slack:
        description: Post the daily Slack digests, to each SDK's own channel (the scheduled run always does). Not the weekly post.
        required: false
        type: boolean
        default: false
      publish:
        description: Publish the site from a branch other than main (a run on main always does).
        required: false
        type: boolean
        default: false
      weekly:
        description: Build the weekly wrap-up of the last full week (a scheduled run does on Mondays). Posts it only with weekly_slack ticked.
        required: false
        type: boolean
        default: false
      weekly_weeks:
        description: With weekly, also build the weeks before it, up to this many in all (to fill in the weeks the store covers).
        required: false
        type: string
        default: "1"
      weekly_slack:
        description: With weekly, post the newest week to the weekly channel (FIT_HEALTH_WEEKLY_SLACK_CHANNEL). Posts nothing to the SDKs' channels.
        required: false
        type: boolean
        default: false

# Least privilege by default; the health and site jobs add id-token: write for OIDC.
permissions:
  contents: read

env:
  # A dev prefix while this is being proven; becomes s3://fit-cli/health/ after.
  FIT_HEALTH_STORE: ${{ inputs.store || 's3://fit-cli/health-dev/' }}
  # Where the health jobs leave their reports and logs for the site job: private, like the
  # store, and removed once the site is built.
  HANDOFF: s3://fit-cli/health-handoff/${{ github.run_id }}-${{ github.run_attempt }}/

jobs:
  opt-ins:
    runs-on: ubuntu-latest
    outputs:
      sdks: ${{ steps.list.outputs.sdks }}
    steps:
      - name: Checkout fit-cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest
      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile
      - name: List opted-in SDKs
        id: list
        env:
          ONLY: ${{ inputs.sdk }}
        run: |
          if [ -n "$ONLY" ]; then
            # The SDK name ends up in job names and CLI arguments: accept only an SDK-shaped value.
            if ! printf '%s' "$ONLY" | grep -Eq '^[a-z0-9][a-z0-9-]{0,40}$'; then
              echo "::error::sdk must be an SDK name like dotnet or java, got: $ONLY"
              exit 1
            fi
            echo "sdks=$(jq -cn --arg s "$ONLY" '[$s]')" >> "$GITHUB_OUTPUT"
          else
            echo "sdks=$(bun src/fit/main/main.ts health opt-ins --json)" >> "$GITHUB_OUTPUT"
          fi

  health:
    needs: opt-ins
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        sdk: ${{ fromJSON(needs.opt-ins.outputs.sdks) }}
    # One run per SDK at a time: two jobs pushing the same SDK's part of the store would race.
    concurrency:
      group: fit-health-${{ matrix.sdk }}
      cancel-in-progress: false
    permissions:
      id-token: write   # GitHub OIDC, to assume fit-cli-role
      contents: read
    steps:
      - name: Checkout fit-cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      # fit-cli-role can read s3://fit-cli/runs/, write the health store, and read the
      # fit-cli/github/token and fit-cli/slack/token secrets.
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-fit-health-${{ matrix.sdk }}-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile

      # The org token reads other repos' Actions logs, including private ones; this
      # workflow's own token only covers the fit-cli repo.
      - name: Fetch GitHub token from AWS secret
        id: gh-secret
        run: |
          TOKEN=$(aws secretsmanager get-secret-value --secret-id fit-cli/github/token \
            --query SecretString --output text | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not read .token from AWS secret fit-cli/github/token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      # The SDK reaches the scripts through env and quoting, never ${{ }} inside run:.
      # Each command's output goes to a file published with the site, not to this public log.
      - name: Backfill ${{ matrix.sdk }}
        env:
          SDK: ${{ matrix.sdk }}
          GH_TOKEN: ${{ steps.gh-secret.outputs.token }}
        run: .github/scripts/health-quiet.sh "out/logs/$SDK/backfill.log" bun src/fit/main/main.ts health backfill "$SDK"

      # Report on what's stored even if backfill failed: a bad night shouldn't cost the report.
      - name: Report ${{ matrix.sdk }}
        if: ${{ !cancelled() }}
        env:
          SDK: ${{ matrix.sdk }}
          # Reads the SDK's and the FIT driver's commits around each change (best-effort).
          GH_TOKEN: ${{ steps.gh-secret.outputs.token }}
          # An expression's '' is falsy, so choose between two non-empty flags. Only --slack
          # posts, and only for an SDK with a channel configured.
          SLACK_FLAG: ${{ (github.event_name == 'schedule' || inputs.slack) && '--slack' || '--no-slack' }}
        run: .github/scripts/health-quiet.sh "out/logs/$SDK/report.log" bun src/fit/main/main.ts health report "$SDK" --out "out/health-report-$SDK" $SLACK_FLAG

      - name: Hand the report to the site job
        if: always()
        run: |
          if [ -d out ]; then
            aws s3 cp --recursive --only-show-errors out "$HANDOFF"
          fi

  # Build the site from every SDK's report and publish it to the internal fit-health repo's
  # site branch, which its Pages serves only to people who can read that repo. A publish
  # replaces the whole site with a single fresh commit: the site is rebuilt in full each day,
  # and keeping its history would only grow the repo.
  site:
    needs: health
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write   # GitHub OIDC, to assume fit-cli-role
      contents: read
    env:
      SITE_REPO: couchbaselabs/fit-health
      # From main; from a branch only when asked, to try a change end to end.
      PUBLISH: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) || inputs.publish }}
    steps:
      - name: Checkout fit-cli
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@517a711dbcd0e402f90c77e7e2f81e849156e31d # v6
        with:
          aws-region: us-west-2
          role-to-assume: arn:aws:iam::958525475024:role/fit-cli-role
          role-session-name: gha-fit-health-site-${{ github.run_id }}
          audience: sts.amazonaws.com
          retry-max-attempts: 3

      # The org token can push to fit-health.
      - name: Fetch GitHub token from AWS secret
        id: gh-secret
        run: |
          TOKEN=$(aws secretsmanager get-secret-value --secret-id fit-cli/github/token \
            --query SecretString --output text | jq -r '.token')
          if [ -z "$TOKEN" ] || [ "$TOKEN" = "null" ]; then
            echo "::error::Could not read .token from AWS secret fit-cli/github/token"
            exit 1
          fi
          echo "::add-mask::$TOKEN"
          echo "token=$TOKEN" >> "$GITHUB_OUTPUT"

      - name: Collect the reports
        run: aws s3 cp --recursive --only-show-errors "$HANDOFF" handoff

      # The published site: the page of an SDK with no report this run is kept from it.
      - name: Fetch the published site
        env:
          TOKEN: ${{ steps.gh-secret.outputs.token }}
        run: |
          basic=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          git -c http.extraheader="AUTHORIZATION: basic $basic" clone --quiet --depth 1 --branch site \
            "https://github.com/$SITE_REPO.git" previous

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: latest

      - name: Install fit-cli dependencies
        run: bun install --frozen-lockfile

      # Every SDK's report from this run, compared with every other's (the same test on the
      # other SDKs), then each SDK's page and the top page. An SDK with no report this run
      # keeps its page from the published site.
      - name: Build the site
        run: .github/scripts/health-quiet.sh handoff/logs/site/build.log bun src/fit/main/main.ts health site --reports handoff --out site --previous previous

      # Mondays (or when asked): the week to Sunday, against the week before, from the store.
      # A week already on the site is frozen, so a rerun builds and posts nothing. It never
      # holds up the daily site: a failure here still publishes it.
      - name: Build the weekly wrap-up
        id: weekly
        continue-on-error: true
        env:
          SCHEDULED: ${{ github.event_name == 'schedule' }}
          ASKED: ${{ inputs.weekly }}
          WEEKS: ${{ inputs.weekly_weeks || '1' }}
          # Only the scheduled run, or a dispatch with weekly_slack ticked, posts; and only once
          # the channel is set. `slack` is the daily digests' input, never this one's.
          CHANNEL: ${{ (github.event_name == 'schedule' || inputs.weekly_slack) && vars.FIT_HEALTH_WEEKLY_SLACK_CHANNEL || '' }}
        run: |
          if [ "$ASKED" != "true" ] && ! { [ "$SCHEDULED" = "true" ] && [ "$(date -u +%u)" = 1 ]; }; then
            echo "Not Monday, and not asked for: no weekly wrap-up."
            exit 0
          fi
          if ! printf '%s' "$WEEKS" | grep -Eq '^[0-9]{1,2}$'; then
            echo "::error::weekly_weeks must be a number from 1 to 52, got: $WEEKS"
            exit 1
          fi
          slack=()
          if [ -n "$CHANNEL" ]; then
            if ! printf '%s' "$CHANNEL" | grep -Eq '^[CG][A-Z0-9]{6,}$'; then
              echo "::error::FIT_HEALTH_WEEKLY_SLACK_CHANNEL must be a Slack channel ID, got: $CHANNEL"
              exit 1
            fi
            slack=(--slack-channel "$CHANNEL")
          fi
          .github/scripts/health-quiet.sh handoff/logs/site/weekly.log bun src/fit/main/main.ts health weekly --out site --weeks "$WEEKS" "${slack[@]}"

      - name: Note a weekly wrap-up failure
        if: ${{ steps.weekly.outcome == 'failure' }}
        run: echo "::warning title=FIT health weekly::The weekly wrap-up failed; the daily site is still published. See logs/site/weekly.log on the health site."

      # This run's command output, kept with the site: the only place it can be read.
      - name: Add the logs
        run: |
          mkdir -p site/health
          if [ -d handoff/logs ]; then cp -R handoff/logs site/health/logs; fi

      - name: Publish the site
        if: ${{ env.PUBLISH == 'true' }}
        env:
          TOKEN: ${{ steps.gh-secret.outputs.token }}
          BUILT_BY: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          basic=$(printf 'x-access-token:%s' "$TOKEN" | base64 -w0)
          echo "::add-mask::$basic"
          cd site
          git init --quiet --initial-branch site
          git add -A
          git -c user.name="FIT health" -c user.email="noreply@couchbase.com" \
            commit --quiet -m "FIT health site" -m "Built by $BUILT_BY"
          git -c http.extraheader="AUTHORIZATION: basic $basic" push --quiet --force \
            "https://github.com/$SITE_REPO.git" HEAD:site
          echo "### FIT health reports: published to [$SITE_REPO](https://github.com/$SITE_REPO)'s private Pages site" >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the handoff
        if: always()
        run: aws s3 rm --recursive --only-show-errors "$HANDOFF"
